<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Сторінку не знайдено | Резюме</title>
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            },
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans transition-colors duration-200 antialiased min-h-screen flex flex-col justify-between selection:bg-primary-500 selection:text-white">

  <!-- Top Bar -->
  <header class="w-full max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 text-slate-900 dark:text-white font-heading font-bold text-lg hover:text-primary-600 dark:hover:text-primary-400 transition-colors">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-primary-600 to-indigo-500 flex items-center justify-center text-white shadow-sm">
        <i data-lucide="file-text" class="w-4 h-4"></i>
      </div>
      <span>Web-Резюме</span>
    </a>

    <!-- Theme Toggle -->
    <button id="theme-btn" onclick="toggleTheme()" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm" title="Змінити тему">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
    </button>
  </header>

  <!-- Main 404 Hero -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="relative max-w-lg w-full text-center">
      <!-- Glow effect in background -->
      <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary-500/15 dark:bg-primary-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="relative bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-3xl p-8 sm:p-10 border border-slate-200/80 dark:border-slate-800/80 shadow-xl shadow-slate-200/50 dark:shadow-none">
        
        <!-- Error Badge -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-primary-50 text-primary-700 dark:bg-primary-950/60 dark:text-primary-300 border border-primary-200 dark:border-primary-800/60 mb-6">
          <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-primary-600 dark:text-primary-400"></i>
          <span>Помилка 404</span>
        </div>

        <!-- Big 404 Typography -->
        <h1 class="text-7xl sm:text-8xl font-black font-heading tracking-tight bg-gradient-to-r from-primary-600 via-indigo-600 to-emerald-500 bg-clip-text text-transparent select-none">
          404
        </h1>

        <h2 class="mt-4 text-2xl font-bold font-heading text-slate-900 dark:text-white">
          Сторінку не знайдено
        </h2>

        <p class="mt-3 text-sm text-slate-600 dark:text-slate-400 leading-relaxed max-w-sm mx-auto">
          Схоже, адреса була введена з помилкою або запитувана сторінка була переміщена чи видалена.
        </p>

        <!-- Action Buttons -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
          <a href="/" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold bg-primary-600 hover:bg-primary-700 text-white shadow-md shadow-primary-500/20 hover:shadow-lg transition-all">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>На головну</span>
          </a>

          <button onclick="history.back()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition-all">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Назад</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-6 text-xs text-slate-500 dark:text-slate-500">
    <p>© 2026 Всі права захищено • <a href="/" class="underline hover:text-slate-700 dark:hover:text-slate-300">Головна</a></p>
  </footer>

  <script>
    // Theme Management
    function initTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      lucide.createIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', initTheme);
  </script>
</body>
</html>
